<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 5: Energy, Power, and LEDs — ELEC 103</title>
<meta name="description" content="ELEC 103 Tinkercad Lab 5: power in resistors and power ratings, LED polarity and current-limiting design, and energy cost.">
<style>
:root {
  /* Palette drawn from the resistor color code and the lab bench */
  --paper: #F3F6F8;
  --surface: #FFFFFF;
  --bench: #17242F;
  --bench-soft: #24384A;
  --ink: #15212C;
  --ink-soft: #4C5C6B;
  --ink-faint: #5A6875;
  --rule: #D3DCE3;
  --rule-soft: #E7ECF0;

  --gold: #B08421;        /* tolerance band — primary accent, fills and rules */
  --gold-text: #8A6414;   /* darkened for small text: 4.9:1 on paper */
  --gold-bright: #D9B23F;
  --brown: #7B4A2D;
  --red: #BE3A2B;
  --orange: #D2691E;
  --green: #2C7A57;
  --blue: #2A5DA8;
  --violet: #6B3FA0;

  --lcd-bg: #101A16;
  --lcd-ink: #7DE3A1;

  --ok-bg: #E3F3EA;
  --ok-ink: #1E6343;
  --no-bg: #FBE7E4;
  --no-ink: #96261A;

  --font-read: "Iowan Old Style", "IBM Plex Serif", Charter, Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --measure: 66ch;
  --ui-scale: 1;
  --r-sm: 3px;
  --r-md: 6px;
  --shadow: 0 1px 2px rgba(21,33,44,.08), 0 6px 20px rgba(21,33,44,.06);
}

/* Dark values live in one place, applied either by explicit choice or by system preference */
:root[data-theme="dark"] {
  --paper: #0E161D;
  --surface: #16212C;
  --bench: #0A1218;
  --bench-soft: #1B2A36;
  --ink: #E4ECF2;
  --ink-soft: #A9BAC7;
  --ink-faint: #8697A5;
  --rule: #2B3C4A;
  --rule-soft: #223140;

  --gold: #E0BC57;
  --gold-text: #E0BC57;
  --gold-bright: #F2D07C;
  --brown: #B77B54;
  --red: #E8695A;
  --orange: #E9924B;
  --green: #5FBF8F;
  --blue: #6FA3E8;
  --violet: #A683DC;

  --ok-bg: #14312A;
  --ok-ink: #86E0B4;
  --no-bg: #35201E;
  --no-ink: #F0958A;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --paper: #0E161D;
    --surface: #16212C;
    --bench: #0A1218;
    --bench-soft: #1B2A36;
    --ink: #E4ECF2;
    --ink-soft: #A9BAC7;
    --ink-faint: #8697A5;
    --rule: #2B3C4A;
    --rule-soft: #223140;

    --gold: #E0BC57;
    --gold-text: #E0BC57;
    --gold-bright: #F2D07C;
    --brown: #B77B54;
    --red: #E8695A;
    --orange: #E9924B;
    --green: #5FBF8F;
    --blue: #6FA3E8;
    --violet: #A683DC;

    --ok-bg: #14312A;
    --ok-ink: #86E0B4;
    --no-bg: #35201E;
    --no-ink: #F0958A;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  }
}

html { font-size: calc(100% * var(--ui-scale)); }

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-read);
  font-size: clamp(1rem, .96rem + .22vw, 1.12rem);
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--gold);
  color: #15212C;
  padding: .75rem 1rem;
  font-family: var(--font-ui);
  z-index: 100;
}
.skip-link:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

.wrap {
  max-width: 74rem;
  margin: 0 auto;
  padding: 0 1rem;
}

.col {
  max-width: var(--measure);
}

/* ---------- Masthead ---------- */

.masthead {
  background: var(--bench);
  color: #E9F0F5;
  padding: 1.6rem 0 1.4rem;
  border-bottom: 3px solid var(--gold);
}
.masthead .wrap { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: baseline; justify-content: space-between; }
.course-line {
  font-family: var(--font-ui);
  font-size: .82rem;
  letter-spacing: .04em;
  color: #9FB4C4;
  margin: 0 0 .3rem;
}
.masthead h1 {
  font-family: var(--font-read);
  font-weight: 600;
  font-size: clamp(1.6rem, 1.2rem + 2vw, 2.6rem);
  line-height: 1.1;
  margin: 0;
  letter-spacing: -.01em;
}
.masthead h1 .ch {
  display: block;
  font-family: var(--font-num);
  font-size: .8rem;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--gold-bright);
  margin-bottom: .5rem;
}
.masthead .lede {
  font-size: .98rem;
  color: #B9CAD7;
  margin: .7rem 0 0;
  max-width: 34ch;
}

/* ---------- Section nav ---------- */

.chapter-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.tablist {
  display: flex;
  flex-wrap: wrap;
  gap: 0 .1rem;
  padding: .2rem 0;
}
.tablist .divider {
  flex: 0 0 100%;
  height: 1px;
  background: var(--rule-soft);
  margin: .15rem 0;
}
@media (max-width: 760px) {
  .chapter-nav { position: static; }
  .tablist button { font-size: .8rem; padding: .45rem .5rem; }
}
.tablist button {
  flex: 0 0 auto;
  min-height: 44px;
  padding: .55rem .6rem;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  font-family: var(--font-ui);
  font-size: .84rem;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.tablist button:hover { color: var(--ink); background: var(--rule-soft); }
.tablist button[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--gold);
  font-weight: 600;
}
.tablist .num {
  font-family: var(--font-num);
  font-size: .74rem;
  color: var(--ink-faint);
}
.tablist button[aria-selected="true"] .num { color: var(--gold-text); }
.tablist .done { color: var(--green); font-size: .8rem; }
.tablist button.extra { color: var(--gold-text); }
.tablist button.extra[aria-selected="true"] { color: var(--ink); }

.progress-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .5rem .75rem;
  padding: .5rem 0 .6rem;
  font-family: var(--font-ui);
  font-size: .78rem;
  color: var(--ink-faint);
}
.bar {
  flex: 1 1 8rem;
  height: 5px;
  background: var(--rule-soft);
  border-radius: 99px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--gold);
  transition: width .3s ease;
}

/* ---------- Display preferences ---------- */

.viewprefs { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
.prefbtn, .sizer button {
  min-height: 32px;
  padding: .25rem .6rem;
  font-family: var(--font-ui);
  font-size: .76rem;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink-soft);
  border-radius: var(--r-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .35rem;
}
.prefbtn:hover, .sizer button:hover { background: var(--rule-soft); color: var(--ink); }
.sizer {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  background: var(--surface);
}
.sizer button { border: none; background: none; min-width: 34px; justify-content: center; }
.sizer button:disabled { opacity: .4; cursor: not-allowed; }
.sizer #textSizeLabel {
  font-family: var(--font-num);
  font-size: .72rem;
  color: var(--ink-faint);
  min-width: 3.1rem;
  text-align: center;
  border-left: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  padding: .25rem .2rem;
}
#themeIcon { font-size: .95rem; line-height: 1; }

/* ---------- Panels ---------- */

main { padding: 2rem 0 4rem; }
.panel { scroll-margin-top: 5.5rem; }
.panel[hidden] { display: none; }
.panel { animation: none; }

h2 {
  font-family: var(--font-read);
  font-weight: 600;
  font-size: clamp(1.35rem, 1.1rem + 1.1vw, 1.9rem);
  line-height: 1.2;
  letter-spacing: -.01em;
  margin: 0 0 .2rem;
}
h2 .sec-no {
  display: block;
  font-family: var(--font-num);
  font-size: .78rem;
  color: var(--gold-text);
  letter-spacing: .1em;
  margin-bottom: .45rem;
}
h3 {
  font-family: var(--font-ui);
  font-size: 1.02rem;
  font-weight: 600;
  margin: 2rem 0 .5rem;
  color: var(--ink);
}
p { margin: 0 0 1rem; }
.panel > .col > p:first-of-type { margin-top: .8rem; }

a { color: var(--blue); }

ul, ol { max-width: var(--measure); padding-left: 1.2rem; }
li { margin-bottom: .4rem; }

.eq {
  font-family: var(--font-num);
  font-size: 1.05em;
  background: var(--rule-soft);
  padding: .08em .35em;
  border-radius: var(--r-sm);
}

.callout {
  border-left: 3px solid var(--gold);
  background: var(--surface);
  padding: .9rem 1.1rem;
  margin: 1.5rem 0;
  max-width: var(--measure);
  border-radius: 0 var(--r-md) var(--r-md) 0;
}
.callout h4 {
  font-family: var(--font-ui);
  font-size: .82rem;
  font-weight: 600;
  margin: 0 0 .4rem;
  color: var(--gold-text);
}
.callout p:last-child { margin-bottom: 0; }
.callout.caution { border-left-color: var(--red); }
.callout.caution h4 { color: var(--red); }

.worked {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 1.1rem 1.2rem;
  margin: 1.5rem 0;
  max-width: var(--measure);
  box-shadow: var(--shadow);
}
.worked h4 {
  font-family: var(--font-ui);
  font-size: .82rem;
  margin: 0 0 .6rem;
  color: var(--ink-faint);
}
.worked .steps {
  font-family: var(--font-num);
  font-size: .92rem;
  line-height: 2;
  margin: .6rem 0 0;
  color: var(--ink);
}
.worked .steps span { display: block; }
.worked .steps .ans { color: var(--green); font-weight: 600; }

/* ---------- Interactive shell ---------- */

.tool {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  margin: 2rem 0;
  overflow: hidden;
}
.tool-head {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem 1rem;
  align-items: center;
  justify-content: space-between;
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--rule);
  background: var(--rule-soft);
}
.tool-head h3 {
  margin: 0;
  font-size: .92rem;
}
.tool-body { padding: 1rem; }

/* ---------- Lab additions ---------- */
.panel .col { max-width: 62rem; }
.panel .col > h2, .panel .col > .intro { max-width: var(--measure); }
:root { --bb: #EDEFF1; --bb-edge: #C9CFD5; --bb-hole: #5C6670; --bb-on: #2C9A5A; --dmm: #3A4652; --psu: #D9DEE3; --wire-edge: rgba(0,0,0,.25); }
:root[data-theme="dark"] { --bb: #D9DDE1; --bb-edge: #9AA4AE; --psu: #C7CDD3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="dark"]) { --bb: #D9DDE1; --bb-edge: #9AA4AE; --psu: #C7CDD3; } }

.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.intro { font-size: 1.05em; color: var(--ink-soft); }
.prose { max-width: var(--measure); }
.prose.wide { max-width: none; }
.sw { display: inline-block; width: .8rem; height: .8rem; border-radius: 2px; border: 1px solid rgba(255,255,255,.5); vertical-align: -1px; margin-right: .3rem; }
.lead { stroke-width: 1.8; }
.prose p, .prose ul, .prose ol { max-width: var(--measure); }
kbd { font-family: var(--font-num); font-size: .82em; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 .3em; background: var(--surface); }
.unit { font-weight: 400; color: var(--ink-faint); font-size: .9em; }

.btn { font-family: var(--font-ui); font-size: .86rem; min-height: 44px; padding: .5rem .95rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; }
.btn:hover { background: var(--rule-soft); }
.btn.primary { background: var(--bench); color: #EAF1F6; border-color: var(--bench); font-weight: 600; }
.btn.primary:hover { background: var(--bench-soft); }
.btn.ghost { background: none; color: var(--ink-soft); }
.btnrow { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }
.linkbtn { background: none; border: none; color: var(--blue); text-decoration: underline; cursor: pointer; font: inherit; padding: .2rem 0; min-height: 32px; }
.pn { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; margin: 3rem 0 0; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
.pn .primary { margin-left: auto; }

.step { display: grid; grid-template-columns: 4.6rem 1fr; gap: .2rem .8rem; margin: 1.4rem 0 .6rem; max-width: var(--measure); }
.step-n { font-family: var(--font-num); font-size: .78rem; color: var(--gold-text); padding-top: .3rem; letter-spacing: .04em; }
.step-b p:last-child { margin-bottom: 0; }
@media (max-width: 520px) { .step { grid-template-columns: 1fr; } }

.callout.tip { border-left-color: var(--blue); } .callout.tip h4 { color: var(--blue); }
.callout.try { border-left-color: var(--green); } .callout.try h4 { color: var(--green); }
.callout ul { margin: .3rem 0 0; }

.fig { margin: 1.6rem 0; max-width: 46rem; }
.fig.small { max-width: 30rem; }
.fig.wide { max-width: 58rem; }
.fig-art { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: .8rem; overflow-x: auto; }
.fig-art svg { display: block; width: 100%; height: auto; min-width: 20rem; }
.fig figcaption { font-family: var(--font-ui); font-size: .82rem; color: var(--ink-soft); margin-top: .5rem; max-width: var(--measure); }

/* bench drawings */
.bench text { font-family: var(--font-ui); }
.bb-body { fill: var(--bb); stroke: var(--bb-edge); }
.bb-channel { fill: var(--bb-edge); }
.bb-hole { fill: var(--bb-hole); }
.bb-hole.on { fill: var(--bb-on); }
.bb-hole.picked { fill: #F2C714; stroke: #1b1b1b; stroke-width: 1; }
.clickable .bb-hole { cursor: pointer; }
.bb-pos { stroke: #C9302C; stroke-width: 1.4; }
.bb-neg { stroke: #2D3339; stroke-width: 1.4; }
.bb-rail-l { font-size: 12px; fill: #2D3339; text-anchor: middle; font-weight: 700; }
.bb-num, .bb-let { font-size: 8px; fill: #5C6670; text-anchor: middle; }
.lead { stroke: #8D969E; stroke-width: 1.8; }
.foot { fill: #4A535B; }
.res-body { fill: #E3C08A; stroke: #B08D57; stroke-width: .8; }
.part-l { font-size: 10.5px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.bench .part-l { fill: #15212C; stroke: #F3F5F7; }
.pin-l { font-size: 8.5px; fill: #1E4A99; text-anchor: middle; font-weight: 700; paint-order: stroke; stroke: #F3F5F7; stroke-width: 3px; }
.wire { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.wire-o { fill: none; stroke: var(--wire-edge); stroke-width: 4.6; stroke-linecap: round; stroke-linejoin: round; }
.pot-body { fill: #2F6BD6; stroke: #1E4A99; }
.pot-knob { fill: #E9ECEF; stroke: #7A838B; stroke-width: 1.2; }
.pot-ptr { stroke: #1b1b1b; stroke-width: 2; stroke-linecap: round; }
.dmm-body { fill: var(--dmm); stroke: #1F272E; }
.dmm-lcd { fill: #C7D6C4; stroke: #6E7F6B; }
.dmm-read, .psu-read { font-family: var(--font-num); font-size: 14px; font-weight: 600; fill: #15212C; }
.psu-read { font-size: 12px; }
.dmm-mode { fill: #56626E; } .dmm-mode.on { fill: #F2C714; }
.dmm-mode-t { font-size: 9.5px; fill: #E4EAEF; text-anchor: middle; font-weight: 700; } .dmm-mode-t.on { fill: #15212C; }
.jack-com { fill: #1b1b1b; stroke: #999; } .jack-pos { fill: #C9302C; stroke: #999; }
.jack-l { font-size: 7.5px; fill: #E4EAEF; text-anchor: middle; font-weight: 700; }
.psu-body { fill: var(--psu); stroke: #8C969F; }
.psu-body ~ .jack-l, .bench .psu-lab { fill: #15212C; }
.note-l { font-size: 10.5px; fill: var(--ink-soft); font-style: italic; }
.bench .note-l { fill: var(--ink-soft); }
.callout-line { stroke: var(--red); stroke-width: 1.6; }
.arr-head { fill: var(--red); }
.mark-bad { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-dasharray: 4 3; }
.mark-t { font-size: 11px; font-weight: 700; fill: var(--red); }

/* schematics */
.sch-w { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.sch-w.thick { stroke-width: 3.6; }
.sch-dot { fill: var(--ink); }
.sch-term { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.sch-tl { font-family: var(--font-ui); font-size: 14px; font-weight: 700; fill: var(--red); }
.sch-n { font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.sch-v { font-family: var(--font-num); font-size: 12px; fill: var(--ink-soft); }
.sch-pin { font-family: var(--font-num); font-size: 9.5px; fill: var(--ink-faint); }
.sch-arrow { fill: var(--ink); }
.sch-meter { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; }
.sch-ml { font-family: var(--font-ui); font-size: 13px; font-weight: 700; fill: var(--ink); }

/* student info */
.student { display: grid; gap: .8rem 1rem; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 1rem; margin: 1.2rem 0; max-width: 50rem; }
.field { display: flex; flex-direction: column; gap: .25rem; font-family: var(--font-ui); }
.field label { font-size: .84rem; font-weight: 600; color: var(--ink); }
.field.inline { flex-direction: row; flex-wrap: wrap; align-items: center; gap: .5rem; }
.field input, .field textarea, .field select, table.data input, table.data select {
  font: inherit; font-family: var(--font-ui); font-size: .95rem; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: var(--r-sm); padding: .5rem .6rem; min-height: 44px;
}
.field textarea { font-family: var(--font-read); line-height: 1.5; resize: vertical; width: 100%; }
.field.work textarea { font-family: var(--font-num); font-size: .9rem; }
.textans { margin: 1rem 0 1.4rem; max-width: var(--measure); }

/* data tables */
.datablock, .nums { margin: 1.2rem 0 1.6rem; }
.data-title { font-family: var(--font-ui); font-size: .9rem; margin: 0 0 .5rem; color: var(--ink); }
.table-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); }
table.data { border-collapse: collapse; font-family: var(--font-ui); font-size: .88rem; min-width: 100%; }
table.data td { white-space: nowrap; }
table.data th, table.data td { border-bottom: 1px solid var(--rule-soft); padding: .45rem .55rem; text-align: center; vertical-align: middle; }
table.data thead th { background: var(--bench); color: #EAF1F6; font-weight: 600; white-space: nowrap; }
table.data tbody th { text-align: left; background: var(--rule-soft); font-weight: 600; white-space: nowrap; }

<script>
/* ==========================================================================
   Bench drawings: breadboard, parts, instruments, and schematics as SVG.
   Every drawing is built from hole coordinates, so layouts stay exact.
   ========================================================================== */
var Draw = (function () {
  'use strict';
  var BAND = ['#1b1b1b', '#7a4a24', '#c9302c', '#e8751a', '#f2c714', '#2e8b3e', '#2d5fc4', '#7b3fb0', '#8c8c8c', '#f4f4f4'];
  var BAND_NAMES = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'gray', 'white'];
  var GOLD = '#c9a13b', SILVER = '#b8bcc2';
  var WIRE = { red: '#d33a2c', black: '#262a2e', green: '#2f9a4a', blue: '#2f6bd6', yellow: '#e2b21c', orange: '#e0781e', white: '#e9ecef', gray: '#8c96a0' };

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function f(n) { return Math.round(n * 10) / 10; }

  /* ---- Resistor color code ---- */
  function bands(ohms) {
    if (!(ohms > 0)) return null;
    var exp = Math.floor(Math.log10(ohms) + 1e-9) - 1;
    var two = Math.round(ohms / Math.pow(10, exp));
    if (two >= 100) { two = Math.round(two / 10); exp += 1; }
    var d1 = Math.floor(two / 10), d2 = two % 10;
    return { d1: d1, d2: d2, mult: exp };   // mult: -2 silver, -1 gold, 0..9
  }
  function multColor(m) { return m === -1 ? GOLD : m === -2 ? SILVER : BAND[m]; }
  function multName(m) { return m === -1 ? 'gold' : m === -2 ? 'silver' : BAND_NAMES[m]; }
  function fmtOhms(o) {
    if (o >= 1e6) return (+(o / 1e6).toPrecision(3)) + ' MΩ';
    if (o >= 1e3) return (+(o / 1e3).toPrecision(3)) + ' kΩ';
    return (+o.toPrecision(3)) + ' Ω';
  }

  /* ---- Scene ---- */
  function Scene(w, h, title) { this.w = w; this.h = h; this.title = title || ''; this.parts = []; this.over = []; }
  Scene.prototype.add = function (s) { this.parts.push(s); return this; };
  Scene.prototype.top = function (s) { this.over.push(s); return this; };
  Scene.prototype.svg = function (cls) {
    return '<svg class="bench ' + (cls || '') + '" viewBox="0 0 ' + this.w + ' ' + this.h + '" role="img" aria-label="' + esc(this.title) +
      '" xmlns="http://www.w3.org/2000/svg">' + this.parts.join('') + this.over.join('') + '</svg>';
  };

  /* ---- Breadboard ---- */
  var P = 16;
  var ROWY = { 't-': 18, 't+': 34, j: 64, i: 80, h: 96, g: 112, f: 128, e: 164, d: 180, c: 196, b: 212, a: 228, 'b-': 258, 'b+': 274 };
  function Board(scene, x, y, cols) {
    this.s = scene; this.x = x; this.y = y; this.cols = cols || 30;
    this.w = 30 * 2 + (this.cols - 1) * P + 20; this.h = 292;
  }
  Board.prototype.p = function (name) {
    var m = /^([tb][+-]|[a-j])(\d+)$/.exec(name);
    if (!m) throw new Error('bad hole ' + name);
    return { x: this.x + 40 + (+m[2] - 1) * P, y: this.y + ROWY[m[1]] };
  };
  Board.prototype.draw = function (opts) {
    opts = opts || {};

      ITEMS.forEach(function (it) { if (it.kind === 'shot') { var d = getShot(it.id) || shotMem[it.id]; if (d) shots[it.id] = d; } });
      var blob = new Blob([JSON.stringify({ key: KEY, state: st, shots: shots })], { type: 'application/json' });
      var a = el('a', { href: URL.createObjectURL(blob), download: (LAB.file || KEY) + '_backup.json' });
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      rmsg.textContent = 'Backup downloaded.';
    });
    fi.addEventListener('change', function () {
      var f = fi.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (d.key !== KEY) { rmsg.textContent = 'That backup is for a different lab.'; return; }
          localStorage.setItem(KEY, JSON.stringify(d.state));
          Object.keys(d.shots || {}).forEach(function (k) { putShot(k, d.shots[k]); });
          rmsg.textContent = 'Backup loaded. Reloading…';
          setTimeout(function () { location.reload(); }, 600);
        } catch (e) { rmsg.textContent = 'That file could not be read as a backup.'; }
      };
      rd.readAsText(f);
    });
    col.appendChild(el('div', { cls: 'btnrow' }, [dl, upl, fi]));
    col.appendChild(rmsg);
  }
  var oldTitle = null;
  function preparePrint() {
    $('#printReport').innerHTML = reportHTML();
    if (oldTitle === null) oldTitle = document.title;
    var last = (st.stu.name || '').trim().split(/\s+/).pop() || 'Student';
    document.title = (LAB.file || 'ELEC103_Lab') + '_' + last.replace(/[^A-Za-z0-9-]/g, '');
    document.body.classList.add('printing');
  }
  function endPrint() {
    document.body.classList.remove('printing');
    if (oldTitle !== null) { document.title = oldTitle; oldTitle = null; }
  }
  window.addEventListener('beforeprint', function () { if (!document.body.classList.contains('printing')) preparePrint(); });
  window.addEventListener('afterprint', endPrint);
  function printReport() { preparePrint(); setTimeout(function () { window.print(); }, 60); }

  /* ---------- Reset ---------- */
  $('#resetAll').addEventListener('click', function () {
    if (!window.confirm('Erase all of your work in this lab, including screenshots? This cannot be undone. Download a backup first if you might need it.')) return;
    try {
      localStorage.removeItem(KEY);
      ITEMS.forEach(function (it) { if (it.kind === 'shot') { localStorage.removeItem(SHOT_PREFIX + it.id); localStorage.removeItem(SHOT_PREFIX + it.id + '-ops'); } });
    } catch (e) {}
    location.reload();
  });

  /* ---------- Side-panel mode and pop-out lab window ---------- */
  var SIDE_KEY = 'elec103-side-v1';
  var forcePanel = /[?&]panel=1/.test(location.search);
  var narrowMQ = window.matchMedia ? window.matchMedia('(max-width: 640px)') : { matches: false };
  function sidePref() { try { return localStorage.getItem(SIDE_KEY); } catch (e) { return null; } }
  function sideOn() { var p = sidePref(); return forcePanel || p === 'on' || (p !== 'off' && narrowMQ.matches); }
  var sideBtns = [], wasSide = null;
  function applySide() {
    var on = sideOn();
    document.documentElement.classList.toggle('side', on);
    sideBtns.forEach(function (bt) { bt.setAttribute('aria-pressed', on ? 'true' : 'false'); bt.textContent = on ? 'Full width' : 'Side panel'; });
    if (on !== wasSide) {
      var navHiddenPref = false; try { navHiddenPref = localStorage.getItem('elec103-nav-v1') === 'hidden'; } catch (e) {}
      document.documentElement.classList.toggle('nav-hidden', on || navHiddenPref);
      wasSide = on;
    }
  }
  function sideToggle() {
    var on = !sideOn();
    try { localStorage.setItem(SIDE_KEY, on ? 'on' : 'off'); } catch (e) {}
    wasSide = null; applySide();
  }
  function popLab() {
    var w = 460, h = (screen.availHeight || 800);
    var left = (screen.availLeft || 0) + (screen.availWidth || 1280) - w, top = screen.availTop || 0;
    var url = location.href.replace(/#.*$/, ''); url += (url.indexOf('?') >= 0 ? '&' : '?') + 'panel=1';
    var win = window.open(url, 'elec103-panel-' + KEY, 'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
    if (!win) window.alert('Your browser blocked the pop-up window. Allow pop-ups for this site and try again.');
    else win.focus();
  }
  function mkSideBtn(cls) { var bt = el('button', { type: 'button', cls: cls, 'aria-pressed': 'false', text: 'Side panel' }); bt.addEventListener('click', sideToggle); sideBtns.push(bt); return bt; }
  function mkPopBtn(cls) { var bt = el('button', { type: 'button', cls: cls, html: 'Pop out <span aria-hidden="true">↗</span>', title: 'Open this lab in its own narrow window beside Tinkercad' }); bt.addEventListener('click', popLab); return bt; }
  var vp = document.querySelector('.viewprefs');
  if (vp) { vp.insertBefore(mkPopBtn('prefbtn'), vp.firstChild); vp.insertBefore(mkSideBtn('prefbtn'), vp.firstChild); }
  function attachSlim() {   // the slim bar is added by the menu script, which runs after this one
    var slim = document.querySelector('.nav-slim');
    if (slim) { var last = slim.lastChild; slim.insertBefore(mkSideBtn('navtog-btn'), last); if (!forcePanel) slim.insertBefore(mkPopBtn('navtog-btn'), last); }
    wasSide = null; applySide();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attachSlim); else setTimeout(attachSlim, 0);
  if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', applySide); else if (narrowMQ.addListener) narrowMQ.addListener(applySide);
  if (forcePanel) document.title = LAB.no + ' · side panel';

  // Two windows on the same lab: when the other window saves, refresh this one the next time it is used
  var stale = false;
  window.addEventListener('storage', function (ev) { if (ev.key && ev.key.indexOf(KEY) === 0) stale = true; });
  function refreshIfStale() {
    if (!stale || document.visibilityState === 'hidden') return;
    try { sessionStorage.setItem(KEY + '-scroll', String(window.scrollY)); } catch (e) {}
    location.reload();
  }
  window.addEventListener('focus', refreshIfStale);
  document.addEventListener('visibilitychange', refreshIfStale);
  document.addEventListener('pointerdown', refreshIfStale, true);
  applySide();

  $('#textSmaller').addEventListener('click', function () { scaleIdx--; applyScale(); });
  $('#textLarger').addEventListener('click', function () { scaleIdx++; applyScale(); });
  $('#themeBtn').addEventListener('click', function () { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); });
  applyScale(); applyTheme();

  var winTab = null; try { winTab = sessionStorage.getItem(KEY + '-tab'); } catch (e) {}
  var start = winTab !== null && +winTab < sections.length ? +winTab : (typeof st.last === 'number' && st.last < sections.length ? st.last : 0);
  show(start, false);
  listeners.forEach(function (fn) { fn(); });
  updateProgress();
  try { var sy = sessionStorage.getItem(KEY + '-scroll'); if (sy !== null) { sessionStorage.removeItem(KEY + '-scroll'); setTimeout(function () { window.scrollTo(0, +sy); }, 30); } } catch (e) {}
  setSaved(ITEMS.some(filled) ? 'Your earlier work was restored from this browser' : 'Work saves automatically in this browser');
})();

</script>
<!-- Hide/show menu: collapses the section tabs and progress row to a slim bar -->
<style>
.navtog-btn { min-height: 32px; padding: .25rem .6rem; font-family: var(--font-ui); font-size: .76rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft); border-radius: var(--r-sm); cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; }
.navtog-btn:hover { background: var(--rule-soft); color: var(--ink); }
.nav-slim { display: none; align-items: center; gap: .5rem; padding: .35rem 0; font-family: var(--font-ui); font-size: .84rem; color: var(--ink-soft); }
.nav-slim .ns-cur { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 600; }
.nav-slim .ns-arrow { min-width: 36px; justify-content: center; }
html.nav-hidden .chapter-nav .tablist, html.nav-hidden .chapter-nav .progress-row { display: none !important; }
html.nav-hidden .chapter-nav .nav-slim { display: flex; }
@media print { .nav-slim, .navtog-btn { display: none !important; } }
</style>
<script>
(function () {
  'use strict';
  var KEY = 'elec103-nav-v1';
  var nav = document.querySelector('.chapter-nav');
  var tablist = document.getElementById('tablist');
  if (!nav || !tablist) return;
  var wrap = nav.querySelector('.wrap') || nav;
  var prefsRow = nav.querySelector('.viewprefs') || nav.querySelector('.progress-row');

  function hiddenPref() { try { return localStorage.getItem(KEY) === 'hidden'; } catch (e) { return false; } }
  function savePref(h) { try { localStorage.setItem(KEY, h ? 'hidden' : 'shown'); } catch (e) {} }

  // "Hide menu" button in the existing settings row
  var hideBtn = document.createElement('button');
  hideBtn.type = 'button'; hideBtn.className = 'navtog-btn'; hideBtn.id = 'navHideBtn';
  hideBtn.setAttribute('aria-controls', 'tablist');
  hideBtn.innerHTML = '<span aria-hidden="true">\u25B4</span>Hide menu';
  prefsRow.insertBefore(hideBtn, prefsRow.firstChild);

  // Slim bar shown while the menu is hidden
  var slim = document.createElement('div');
  slim.className = 'nav-slim'; slim.setAttribute('role', 'group'); slim.setAttribute('aria-label', 'Section navigation');
  var prev = document.createElement('button'); prev.type = 'button'; prev.className = 'navtog-btn ns-arrow'; prev.setAttribute('aria-label', 'Previous section'); prev.textContent = '\u2039';
  var cur = document.createElement('span'); cur.className = 'ns-cur'; cur.setAttribute('aria-live', 'polite');
  var next = document.createElement('button'); next.type = 'button'; next.className = 'navtog-btn ns-arrow'; next.setAttribute('aria-label', 'Next section'); next.textContent = '\u203A';
  var showBtn = document.createElement('button'); showBtn.type = 'button'; showBtn.className = 'navtog-btn'; showBtn.setAttribute('aria-controls', 'tablist');
  showBtn.innerHTML = '<span aria-hidden="true">\u25BE</span>Show menu';
  slim.appendChild(prev); slim.appendChild(cur); slim.appendChild(next); slim.appendChild(showBtn);
  wrap.appendChild(slim);

  function tabs() { return Array.prototype.slice.call(tablist.querySelectorAll('[role="tab"]')); }
  function curIndex() { var t = tabs(); for (var i = 0; i < t.length; i++) if (t[i].getAttribute('aria-selected') === 'true') return i; return 0; }
  function label(t) { var parts = []; Array.prototype.forEach.call(t.childNodes, function (n) { var x = (n.textContent || '').trim(); if (x) parts.push(x); }); return (parts.join(' ') || t.getAttribute('aria-label') || '').replace(/\s*\u2713\s*/g, ' ').replace(/,\s*complete$/i, '').replace(/\s+/g, ' ').trim(); }
  function refresh() {
    var t = tabs(), i = curIndex();
    if (!t.length) return;
    cur.textContent = label(t[i]);
    prev.disabled = i === 0; next.disabled = i === t.length - 1;
  }
  function go(d) {
    var t = tabs(), i = curIndex() + d;
    if (i < 0 || i >= t.length) return;
    t[i].click();
    window.scrollTo(0, 0);
    setTimeout(refresh, 0);
  }
  prev.addEventListener('click', function () { go(-1); });
  next.addEventListener('click', function () { go(1); });

  function apply(h, focus) {
    document.documentElement.classList.toggle('nav-hidden', h);
    hideBtn.setAttribute('aria-expanded', h ? 'false' : 'true');
    showBtn.setAttribute('aria-expanded', h ? 'false' : 'true');
    refresh();
    if (focus) (h ? showBtn : hideBtn).focus();
  }
  hideBtn.addEventListener('click', function () { savePref(true); apply(true, true); });
  showBtn.addEventListener('click', function () { savePref(false); apply(false, true); });

  // Keep the slim bar's section name current however the section changes
  if (window.MutationObserver) new MutationObserver(refresh).observe(tablist, { subtree: true, attributes: true, attributeFilter: ['aria-selected'], childList: true });
  apply(hiddenPref(), false);
  setTimeout(refresh, 50);
})();
</script>
